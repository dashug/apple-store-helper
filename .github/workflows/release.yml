name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 测试
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 的 go 1.22.0 只是下限。Go 1.22 内部链接产出的纯 Go 二进制
          # 缺少 LC_UUID，新版 macOS 的 dyld 会拒绝执行（如 fyne CLI），
          # Go 1.24 起修复，故 CI 统一用较新工具链
          go-version: "1.25"
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

      - name: 校验 services 不依赖图形库
        # services 一旦重新引入 fyne，链接出来的二进制在无桌面环境会因为
        # 缺 libGL / libX11 起不来，headless 运行就没了。这里当场拦住。
        run: |
          if go list -deps ./services/ | grep -E 'fyne|faiface/beep'; then
            echo "::error::services 不应依赖图形或音频库，上面是引入的包"
            exit 1
          fi
          echo "services 无图形依赖"

  changes:
    name: 判断改动范围
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测是否含代码改动
        id: detect
        run: |
          # tag 推送一律全量构建，与改动内容无关。
          # 发版不能因为判断失误漏掉产物，这个方向的错误代价远大于多跑十分钟。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tag 推送，全量构建"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi

          # 拿不到比较基准时保守处理，按有代码改动对待
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "无法确定比较基准，按含代码改动处理"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "本次改动:"
          echo "$changed" | sed 's/^/  /'

          # 只有这几类文件不影响构建产物。
          # Icon.png 不在其中：它通过 go:embed 进入二进制，也用于打包图标。
          if echo "$changed" | grep -vE '\.md$|^screenshot\.png$|^LICENSE$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "含代码改动，执行构建"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "仅文档改动，跳过构建"
          fi

  meta:
    name: 解析版本
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      semver: ${{ steps.v.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="dev-$(git rev-parse --short HEAD)"
          fi

          # fyne 的 --app-version 只接受 x / x.y / x.y.z
          SEMVER="${TAG#v}"
          [[ "$SEMVER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || SEMVER="0.0.0"

          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "版本: $TAG (app-version=$SEMVER)"

  build-darwin:
    name: 构建 macOS (universal)
    needs: [test, meta, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      SEMVER: ${{ needs.meta.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 的 go 1.22.0 只是下限。Go 1.22 内部链接产出的纯 Go 二进制
          # 缺少 LC_UUID，新版 macOS 的 dyld 会拒绝执行（如 fyne CLI），
          # Go 1.24 起修复，故 CI 统一用较新工具链
          go-version: "1.25"
          cache: true

      - name: 安装 fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 写入版本号
        # fyne package 不支持 --ldflags，统一改写源文件注入版本
        run: |
          printf 'package common\n\nvar VERSION = "%s"\n' "$TAG" > common/const.go
          cat common/const.go

      - name: 构建 universal 二进制
        # macOS SDK 自带两个架构的 slice，arm64 runner 可直接交叉编译 amd64，
        # 再用 lipo 合成 universal，一个包同时覆盖 Intel 与 Apple Silicon
        run: |
          mkdir -p build dist
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -o build/ash-arm64 .
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-arch x86_64" CGO_LDFLAGS="-arch x86_64" \
            go build -o build/ash-amd64 .
          lipo -create -output "build/PickupRadar" build/ash-arm64 build/ash-amd64
          lipo -info "build/PickupRadar"

      - name: 打包并签名 .app
        # darwin 目标下 fyne package 会复用 --executable 指定的二进制，universal 得以保留
        run: |
          fyne package --target darwin \
            --executable "build/PickupRadar" \
            --name "PickupRadar" \
            --app-id com.github.dashug.pickupradar \
            --app-version "$SEMVER" \
            --icon Icon.png
          xattr -cr "PickupRadar.app"
          codesign --force --deep --sign - "PickupRadar.app"
          codesign -dv "PickupRadar.app"
          ditto -c -k --sequesterRsrc --keepParent "PickupRadar.app" \
            "dist/PickupRadar-${TAG}-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    name: 构建 Windows (${{ matrix.arch }})
    needs: [test, meta, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      SEMVER: ${{ needs.meta.outputs.semver }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            cc: x86_64-w64-mingw32-gcc
          - arch: "386"
            cc: i686-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod 的 go 1.22.0 只是下限。Go 1.22 内部链接产出的纯 Go 二进制
          # 缺少 LC_UUID，新版 macOS 的 dyld 会拒绝执行（如 fyne CLI），
          # Go 1.24 起修复，故 CI 统一用较新工具链
          go-version: "1.25"
          cache: true

      - name: 安装 mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64 libgl1-mesa-dev xorg-dev

      - name: 安装 fyne CLI
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 写入版本号
        run: |
          printf 'package common\n\nvar VERSION = "%s"\n' "$TAG" > common/const.go
          cat common/const.go

      - name: 打包 exe
        # windows 目标下 fyne package 会忽略 --executable 自行重编译，
        # 因此这里不预编译，直接让它用 mingw 构建
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} CC=${{ matrix.cc }} \
            fyne package --target windows \
              --name "PickupRadar" \
              --app-id com.github.dashug.pickupradar \
              --app-version "$SEMVER" \
              --icon Icon.png
          file "PickupRadar.exe"
          zip -j "dist/PickupRadar-${TAG}-windows-${{ matrix.arch }}.zip" "PickupRadar.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  build-cli:
    name: 构建命令行版
    needs: [test, meta, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 写入版本号
        run: printf 'package common\n\nvar VERSION = "%s"\n' "$TAG" > common/const.go

      - name: 交叉编译
        # 命令行版不依赖图形库，CGO_ENABLED=0 可产出静态二进制，
        # 丢进任何 Linux 服务器都能直接跑，不需要装 libGL / libX11
        run: |
          mkdir -p dist

          build() {
            local os=$1 arch=$2 ext=$3
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/pickup-radar$ext" ./cmd/pickup-radar

            ( cd dist && zip -q "pickup-radar-${TAG}-${os}-${arch}.zip" "pickup-radar$ext" \
              && rm "pickup-radar$ext" )
          }

          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"

          ls -lh dist

      - name: 冒烟测试
        # 此前 CI 只编译命令行版，一次都没执行过 ——
        # 能编译不等于能跑起来（比如初始化阶段就 panic）
        run: |
          go build -o /tmp/cli-smoke ./cmd/pickup-radar

          echo "--- --version ---"
          /tmp/cli-smoke --version

          echo "--- --list-areas ---"
          /tmp/cli-smoke --list-areas

          # 至少要能列出地区，否则内嵌数据或初始化有问题
          if [ "$(/tmp/cli-smoke --list-areas | wc -l)" -lt 1 ]; then
            echo "::error::命令行版无法列出地区"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-darwin, build-windows, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
          ## 下载

          | 系统 | 文件 |
          | --- | --- |
          | macOS (Intel + Apple Silicon 通用) | `*-macos-universal.zip` |
          | Windows 64 位 | `*-windows-amd64.zip` |
          | Windows 32 位 | `*-windows-386.zip` |
          | 命令行版（无需桌面环境） | `pickup-radar-*.zip` |

          ## macOS 首次打开

          安装包已做 ad-hoc 签名，但从浏览器下载仍会被隔离属性拦下，解压后执行：

          ```shell
          xattr -cr "PickupRadar.app"
          ```

          之后双击即可运行。
          NOTES
          )"
