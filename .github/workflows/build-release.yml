name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, 386]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Windows ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          fyne package -os windows -name "Apple Store Helper" -icon Icon.png
          Compress-Archive -Path "Apple Store Helper.exe" -DestinationPath "Apple-Store-Helper-Windows-${{ matrix.arch }}.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: Apple-Store-Helper-Windows-${{ matrix.arch }}.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: brew install pkg-config

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          fyne package -os darwin -name "Apple Store Helper" -icon Icon.png
          # 处理签名
          xattr -cr "Apple Store Helper.app" || true
          codesign --force --deep --sign - "Apple Store Helper.app" || true
          # 打包
          zip -r "Apple-Store-Helper-macOS-${{ matrix.arch }}.zip" "Apple Store Helper.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Apple-Store-Helper-macOS-${{ matrix.arch }}.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Linux amd64
        run: |
          fyne package -os linux -name "apple-store-helper" -icon Icon.png
          tar -czf Apple-Store-Helper-Linux-amd64.tar.gz "apple-store-helper"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: Apple-Store-Helper-Linux-amd64.tar.gz

  create-release:
    name: Create Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎉 Apple Store Helper - 新版本发布
            
            ### 📥 下载指南
            
            请根据您的操作系统选择对应的版本：
            
            #### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `Apple-Store-Helper-macOS-arm64.zip`
            - **Intel 处理器**: `Apple-Store-Helper-macOS-amd64.zip`
            
            #### Windows
            - **64位系统**: `Apple-Store-Helper-Windows-amd64.zip`
            - **32位系统**: `Apple-Store-Helper-Windows-386.zip`
            
            #### Linux
            - **64位系统**: `Apple-Store-Helper-Linux-amd64.tar.gz`
            
            ---
            
            ### 🔧 macOS 安装说明
            
            1. 下载并解压 zip 文件
            2. 如果遇到「无法打开」的提示，请在终端中运行：
               ```bash
               xattr -cr "/path/to/Apple Store Helper.app"
               ```
               将 `/path/to/` 替换为实际的应用路径
            
            ### 🪟 Windows 安装说明
            
            1. 下载并解压 zip 文件
            2. 直接运行 `Apple Store Helper.exe`
            3. 如果 Windows Defender 提示，请选择「仍要运行」
            
            ### 🐧 Linux 安装说明
            
            1. 解压 tar.gz 文件
            2. 给予执行权限：`chmod +x apple-store-helper`
            3. 运行：`./apple-store-helper`
            
            ---
            
            ### ✨ 本版本更新内容
            
            详见下方的自动生成的更新日志。
            
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

