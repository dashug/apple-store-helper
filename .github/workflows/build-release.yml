name: Build and Release

on:
  push:
    branches:
      - main  # 推送到 main 分支时自动触发
      - master  # 兼容 master 分支
    tags:
      - 'v*'  # 推送版本标签时也触发
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  build-windows-amd64:
    name: Build Windows AMD64
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Windows AMD64
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -o "Apple Store Helper.exe" -ldflags="-H windowsgui" .
          if (Test-Path "Apple Store Helper.exe") {
            Compress-Archive -Path "Apple Store Helper.exe" -DestinationPath "Apple-Store-Helper-Windows-amd64.zip"
          } else {
            Write-Error "Build failed: exe not found"
            exit 1
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: Apple-Store-Helper-Windows-amd64.zip

  build-windows-386:
    name: Build Windows 386
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Windows 386
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: 386
        run: |
          go build -o "Apple Store Helper.exe" -ldflags="-H windowsgui" .
          if (Test-Path "Apple Store Helper.exe") {
            Compress-Archive -Path "Apple Store Helper.exe" -DestinationPath "Apple-Store-Helper-Windows-386.zip"
          } else {
            Write-Error "Build failed: exe not found"
            exit 1
          }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-386
          path: Apple-Store-Helper-Windows-386.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: brew install pkg-config

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build macOS ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          fyne package -os darwin -name "Apple Store Helper" -icon Icon.png
          # 处理签名
          xattr -cr "Apple Store Helper.app" || true
          codesign --force --deep --sign - "Apple Store Helper.app" || true
          # 打包
          zip -r "Apple-Store-Helper-macOS-${{ matrix.arch }}.zip" "Apple Store Helper.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Apple-Store-Helper-macOS-${{ matrix.arch }}.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libasound2-dev pkg-config

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build Linux amd64
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o "apple-store-helper" .
          if [ -f "apple-store-helper" ]; then
            tar -czf Apple-Store-Helper-Linux-amd64.tar.gz apple-store-helper
            echo "✅ Linux build successful"
          else
            echo "❌ Linux build failed: executable not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: Apple-Store-Helper-Linux-amd64.tar.gz

  create-release:
    name: Create Release
    needs: [build-windows-amd64, build-windows-386, build-macos, build-linux]
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Generate version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # 如果是标签触发，使用标签名
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            # 如果是分支推送，生成基于时间的版本号
            VERSION="v$(date +'%Y.%m.%d')-build.$(echo ${{ github.sha }} | cut -c1-7)"
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_tag == 'false' }}
          generate_release_notes: true
          body: |
            ## 🎉 Apple Store Helper - ${{ steps.version.outputs.is_tag == 'true' && '正式版本' || '自动构建版本' }}
            
            > **版本号**: `${{ steps.version.outputs.tag }}`  
            > **构建时间**: ${{ github.event.head_commit.timestamp }}  
            > **提交**: ${{ github.sha }}
            
            ${{ steps.version.outputs.is_tag == 'false' && '⚠️ 这是自动构建版本，建议测试使用。正式版本请等待带 `v*.*.*` 标签的 Release。' || '' }}
            
            ---
            
            ### 📥 下载指南
            
            请根据您的操作系统选择对应的版本：
            
            #### macOS
            - **Apple Silicon (M1/M2/M3/M4)**: `Apple-Store-Helper-macOS-arm64.zip`
            - **Intel 处理器**: `Apple-Store-Helper-macOS-amd64.zip`
            
            #### Windows
            - **64位系统**: `Apple-Store-Helper-Windows-amd64.zip`
            - **32位系统**: `Apple-Store-Helper-Windows-386.zip`
            
            #### Linux
            - **64位系统**: `Apple-Store-Helper-Linux-amd64.tar.gz`
            
            ---
            
            ### 🔧 macOS 安装说明
            
            1. 下载并解压 zip 文件
            2. 如果遇到「无法打开」的提示，请在终端中运行：
               ```bash
               xattr -cr "/path/to/Apple Store Helper.app"
               ```
               将 `/path/to/` 替换为实际的应用路径
            
            ### 🪟 Windows 安装说明
            
            1. 下载并解压 zip 文件
            2. 直接运行 `Apple Store Helper.exe`
            3. 如果 Windows Defender 提示，请选择「仍要运行」
            
            ### 🐧 Linux 安装说明
            
            1. 解压 tar.gz 文件
            2. 给予执行权限：`chmod +x apple-store-helper`
            3. 运行：`./apple-store-helper`
            
            ---
            
            ### ✨ 本版本更新内容
            
            详见下方的自动生成的更新日志。
            
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

